# Configuració del motor d'anàlisi de KataGo per a CPU i 9x9, ajustada per a
# una petjada baixa en un portàtil (poca CPU i poca RAM).
# El `maxVisits` real de cada jugada arriba per la petició (segons la dificultat).
#
# Si la teva versió de KataGo es queixa d'algun paràmetre, parteix del fitxer
# oficial `analysis_example.cfg` que ve amb KataGo i afegeix-hi aquests valors.

# Un sol fil: mínima càrrega de CPU (en 9x9 amb pocs visits ja va prou ràpid).
numAnalysisThreads = 1
numSearchThreads = 1

# Fils del backend Eigen (CPU) per avaluar la xarxa. Baix = menys saturació.
numEigenThreadsPerModel = 2

# Memòria cau de la xarxa neuronal, reduïda per gastar menys RAM.
nnCacheSizePowerOfTwo = 15
nnMutexPoolSizePowerOfTwo = 12
nnMaxBatchSize = 2

# La regla i el komi els fixa cada petició d'anàlisi.
